version: '3.8'

services:
  mira-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mira-multimodal-agent
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGINS=*
    restart: unless-stopped
